project_name: "OpenHyperAI"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Needs In-Game Test", "Done"]
labels: ["laning", "farming", "macro", "teamfight", "wards", "hero", "weak-hero", "draft", "builds", "items", "tooling"]
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
